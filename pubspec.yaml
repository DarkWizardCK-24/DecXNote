name: deck_note
description: "DecXNote - a modern card-based to-do app built with Flutter and Firebase."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_card_swiper: ^7.1.0
  provider: ^6.1.5+1
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  glassmorphism: ^4.0.0
  font_awesome_flutter: ^11.0.0
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  cloud_firestore: ^6.0.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Launcher icons are generated from assets/images (see tool/generate_logo.py):
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/launcher_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/images/launcher_background.png"
  adaptive_icon_foreground: "assets/images/launcher_foreground.png"
  windows:
    generate: true
    image_path: "assets/images/launcher_icon.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/images/launcher_icon.png"
    background_color: "#0A0E27"
    theme_color: "#FF6F61"
